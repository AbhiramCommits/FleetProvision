stages:
  - lint
  - test
  - iac
  - e2e
  - bench

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  RUSTFLAGS: "-D warnings"

default:
  interruptible: true

.rs-cache: &rs-cache
  cache:
    key: "cargo-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - target/

rust:fmt-clippy:
  stage: lint
  image: rust:latest
  <<: *rs-cache
  before_script:
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings

rust:test:
  stage: test
  image: rust:latest
  <<: *rs-cache
  script:
    - cargo test --workspace
  artifacts:
    when: always
    paths:
      - results/
    expire_in: 1 week

iac:terraform-validate:
  stage: iac
  image:
    name: hashicorp/terraform:1.16.5
    entrypoint: [""]
  script:
    - apk add --no-cache bash python3 py3-yaml
    - bash scripts/iac-validate.sh terraform
  artifacts:
    when: always
    paths:
      - results/iac-terraform.txt
      - results/iac-plan-counts.json
    expire_in: 1 week

iac:packer-validate:
  stage: iac
  image:
    name: hashicorp/packer:1.16.1
    entrypoint: [""]
  variables:
    SKIP_AGENT_BUILD: "1"
  before_script:
    - apk add --no-cache bash ansible
    - mkdir -p target/release
    - echo '#!/bin/sh' > target/release/fleet-agent
    - echo 'exit 0' >> target/release/fleet-agent
    - chmod +x target/release/fleet-agent
  script:
    - bash scripts/iac-validate.sh packer
  artifacts:
    when: always
    paths:
      - results/iac-packer.txt
    expire_in: 1 week

iac:ansible-lint:
  stage: iac
  image: python:3.12
  before_script:
    - pip install ansible-core ansible-lint
  script:
    - bash scripts/iac-validate.sh ansible
  artifacts:
    when: always
    paths:
      - results/iac-ansible.txt
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

e2e:provision-sim:
  stage: e2e
  image: rust:latest
  <<: *rs-cache
  script:
    - cargo build -p fleet-sim --release
    - cargo run -p fleet-sim --release -- e2e --nodes 20
  artifacts:
    when: always
    paths:
      - results/
    expire_in: 1 week

bench:metrics:
  stage: bench
  image: rust:latest
  <<: *rs-cache
  script:
    - cargo build -p fleet-sim --release
    - cargo run -p fleet-sim --release -- bench --out results
  artifacts:
    when: always
    paths:
      - results/
    expire_in: 4 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
