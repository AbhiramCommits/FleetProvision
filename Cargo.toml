[workspace]
resolver = "2"
members = [
    "crates/fleet-pki",
    "crates/fleet-attest",
    "crates/fleet-proto",
    "crates/fleetd",
    "crates/fleetctl",
    "crates/fleet-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://example.invalid/FleetProvision"
authors = ["FleetProvision Authors"]

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
jsonwebtoken = "9"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
pem = "3"
quick-xml = "0.37"
rand = "0.8"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
roxmltree = "0.20"
rsa = { version = "0.9", features = ["sha2", "pem"] }
rustls = "0.23"
rustls-pki-types = "1"
rustls-webpki = { version = "0.103", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
