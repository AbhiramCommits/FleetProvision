---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: Reload sshd
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
    state: reloaded
